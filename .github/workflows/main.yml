name: CI

# Build check only. Deploys come from the hosting provider's Git integration
# (Netlify today, Vercel after cutover), so this workflow never deploys.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Non-blocking until the existing lint errors are fixed; flip
      # continue-on-error to false once `npm run lint` passes.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

      # Add a Test step (npm test) once a test runner is set up.
